global:
  scrape_interval: 60s
  evaluation_interval: 60s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "rules/serverhub.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Managed servers: add one static_config per host running node-exporter,
  # labelling it with its ServerHub id so alerts map back automatically:
  # - job_name: "managed"
  #   static_configs:
  #     - targets: ["managed-host-1:9100"]
  #       labels: {server_id: "1"}
