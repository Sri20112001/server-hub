services:
  serverhub:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: serverhub
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PORT: "4000"
      DB_PATH: /app/data/serverhub.db
      JWT_SECRET: ${JWT_SECRET}
      SERVERHUB_ENCRYPTION_KEY: ${SERVERHUB_ENCRYPTION_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-https://imagesoft.in/server-hub}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      HEALTH_CHECK_INTERVAL_SEC: "60"
      COOKIE_SECURE: "false"
      SCAN_ROOTS: ${SCAN_ROOTS:-/srv/apps}
      BACKUP_DIR: /app/data/backups
      ALERT_CPU_PCT: ${ALERT_CPU_PCT:-85}
      ALERT_RAM_PCT: ${ALERT_RAM_PCT:-90}
      ALERT_DISK_PCT: ${ALERT_DISK_PCT:-80}