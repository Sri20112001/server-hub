name: server-hub
# SECURITY NOTES (see server/README.md "Security model"):
# - Postgres is bound to 127.0.0.1 only. It is reachable from the host for
#   administration, but never from the LAN/Internet. The app reaches it as
#   `postgres:5432` over the Compose network.
# - POSTGRES_PASSWORD has NO default: Compose fails closed if it is unset.
#   Set it in the environment or server/.env (see server/.env.example).
# - Never publish the serverhub API port beyond localhost without a
#   TLS-terminating reverse proxy (Caddy/Apache/Nginx) in front.
# - Prometheus and Alertmanager are NOT published externally; only
#   serverhub reaches them over the internal Compose network.
services:
  postgres:
    image: postgres:16-alpine
    container_name: serverhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serverhub}
      POSTGRES_USER: ${POSTGRES_USER:-serverhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or server/.env (no default password)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serverhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: serverhub-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    # NOT published externally — only serverhub reaches it.
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: serverhub-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - amdata:/alertmanager
    expose:
      - "9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: serverhub-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)"
    expose:
      - "9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: serverhub-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"

  serverhub:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: serverhub
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER:-serverhub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or server/.env (no default password)}@postgres:5432/${POSTGRES_DB:-serverhub}?sslmode=disable
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      JWT_SECRET: ${JWT_SECRET}
      SERVERHUB_ENCRYPTION_KEY: ${SERVERHUB_ENCRYPTION_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-https://imagesoft.in/server-hub}
      # CORS origin (scheme+host only, no path). Empty = derive from
      # FRONTEND_URL above (path stripped with a warning).
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      HEALTH_CHECK_INTERVAL_SEC: "60"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      SCAN_ROOTS: ${SCAN_ROOTS:-/srv/apps}
      BACKUP_DIR: /app/data/backups
      ALERT_CPU_PCT: ${ALERT_CPU_PCT:-85}
      ALERT_RAM_PCT: ${ALERT_RAM_PCT:-90}
      ALERT_DISK_PCT: ${ALERT_DISK_PCT:-80}
      # Prometheus + Alertmanager (internal Compose hostnames)
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_TIMEOUT_SEC: "10"
      ALERTMANAGER_URL: http://alertmanager:9093
      ALERTMANAGER_TIMEOUT_SEC: "10"
      ALERTMANAGER_WEBHOOK_SECRET: ${ALERTMANAGER_WEBHOOK_SECRET:-}

volumes:
  pgdata:
  promdata:
  amdata: