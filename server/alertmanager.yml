global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "serverhub-webhook"

receivers:
  - name: "serverhub-webhook"
    webhook_configs:
      - url: "http://serverhub:4000/server-hub/api/webhooks/alertmanager"
        send_resolved: true
        # Uncomment and set ALERTMANAGER_WEBHOOK_SECRET to enable shared-secret auth:
        # http_config:
        #   headers:
        #     X-Alertmanager-Secret: "your-secret-here"

inhibit_rules: []
